<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>読み上げリーダー</title>
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="読み上げ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#1c1c1e;
    --sub:#8a8a8e;
    --accent:#0a84ff;
    --danger:#ff3b30;
    --border:#e5e5ea;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    overscroll-behavior:none;}
  #app{max-width:600px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header.topbar{
    position:sticky; top:0; z-index:10;
    padding:calc(12px + var(--safe-top)) 16px 12px;
    background:rgba(245,245,247,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  header.topbar h1{font-size:17px; font-weight:600; margin:0; flex:1; text-align:center;}
  .icon-btn{
    width:34px; height:34px; border:none; background:none; color:var(--accent);
    font-size:20px; display:flex; align-items:center; justify-content:center; border-radius:50%;
    cursor:pointer;
  }
  .icon-btn:active{background:rgba(0,0,0,0.06);}

  .view{display:none; flex:1; flex-direction:column; padding:16px 16px calc(24px + var(--safe-bottom));}
  .view.active{display:flex;}

  /* -------- List view -------- */
  .empty-state{margin-top:40px; text-align:center; color:var(--sub); font-size:14px; line-height:1.8;}
  .article-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .article-card{
    background:var(--card); border-radius:14px; padding:14px 16px;
    display:flex; flex-direction:column; gap:6px; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .article-card:active{background:#f0f0f2;}
  .article-title{font-size:15px; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .article-meta{font-size:12px; color:var(--sub); display:flex; justify-content:space-between; align-items:center;}
  .progress-track{height:4px; border-radius:2px; background:var(--border); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:2px;}
  .delete-btn{font-size:12px; color:var(--danger); background:none; border:none; padding:4px 0; align-self:flex-end;}

  .fab{
    position:fixed; right:calc(16px + (100vw - 600px) / 2); bottom:calc(24px + var(--safe-bottom));
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff;
    border:none; font-size:28px; box-shadow:0 4px 14px rgba(10,132,255,0.4); cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:20;
  }
  @media (max-width:632px){ .fab{ right:16px; } }

  /* -------- Add view -------- */
  .segmented{display:flex; background:#e9e9eb; border-radius:9px; padding:2px; margin-bottom:16px;}
  .segmented button{flex:1; border:none; background:none; padding:7px 0; font-size:13px; border-radius:7px; cursor:pointer; color:var(--text);}
  .segmented button.active{background:#fff; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.15);}
  label.field-label{font-size:12px; color:var(--sub); margin:14px 0 6px; display:block;}
  input[type=text], input[type=url], input[type=password], textarea{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:12px;
    font-size:15px; background:var(--card); font-family:inherit; color:var(--text);
  }
  textarea{min-height:220px; resize:vertical; line-height:1.6;}
  .hint{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.6;}
  .primary-btn{
    margin-top:20px; width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  }
  .primary-btn:disabled{background:#b9b9bb; cursor:default;}
  .secondary-btn{
    margin-top:10px; width:100%; padding:12px; border:1px solid var(--border); border-radius:12px;
    background:var(--card); color:var(--text); font-size:14px; cursor:pointer;
  }
  .status-msg{font-size:13px; margin-top:10px; line-height:1.6;}
  .status-msg.error{color:var(--danger);}
  .status-msg.ok{color:#248a3d;}

  /* -------- Reader view -------- */
  .reader-header{margin-bottom:10px;}
  .reader-title{font-size:19px; font-weight:700; line-height:1.4; margin:4px 0 2px;}
  .reader-source{font-size:12px; color:var(--sub); word-break:break-all;}
  .reader-text{
    flex:1; overflow-y:auto; background:var(--card); border-radius:14px; padding:18px;
    font-size:16px; line-height:2; margin:14px 0; -webkit-overflow-scrolling:touch;
  }
  .chunk{cursor:pointer; border-radius:4px; padding:1px 2px;}
  .chunk.speaking{background:#ffe58a;}
  .controls-card{
    background:var(--card); border-radius:16px; padding:14px 16px calc(14px + var(--safe-bottom)/2);
    position:sticky; bottom:0;
  }
  .progress-row{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--sub); margin-bottom:10px;}
  .progress-row .progress-track{flex:1;}
  .transport{display:flex; align-items:center; justify-content:center; gap:28px; margin-bottom:10px;}
  .transport button{background:none; border:none; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .transport .play-btn{
    width:60px; height:60px; border-radius:50%; background:var(--accent); color:#fff; font-size:22px;
  }
  .transport .skip-btn{font-size:26px; color:var(--accent); width:44px; height:44px;}
  .settings-row{display:flex; gap:10px; align-items:center;}
  .settings-row select{flex:1; border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; background:var(--card); color:var(--text);}
  .rate-label{font-size:12px; color:var(--sub); white-space:nowrap; width:50px;}
  .rate-presets{display:flex; gap:6px; margin-bottom:10px;}
  .rate-presets button{
    flex:1; border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:8px; padding:8px 0; font-size:12px; cursor:pointer;
  }
  .rate-presets button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  input[type=range]{flex:1;}

  .player-status{font-size:12px; color:var(--sub); text-align:center; min-height:16px; margin-bottom:6px; line-height:1.5;}
  .player-status.error{color:var(--danger);}
  .transport .play-btn:disabled{opacity:0.6;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== List View ===== -->
  <section id="view-list" class="view active">
    <header class="topbar">
      <span style="width:34px"></span>
      <h1>読み上げリーダー</h1>
      <button class="icon-btn" id="btn-settings-open" title="設定">⚙</button>
    </header>
    <div style="flex:1; padding-top:8px;">
      <div id="empty-state" class="empty-state hidden">
        まだ記事がありません。<br>右下の + から記事を追加してください。
      </div>
      <ul id="article-list" class="article-list"></ul>
    </div>
    <button class="fab" id="btn-add-open">+</button>
  </section>

  <!-- ===== Add View ===== -->
  <section id="view-add" class="view">
    <header class="topbar">
      <button class="icon-btn" id="btn-add-cancel">‹</button>
      <h1>記事を追加</h1>
      <span style="width:34px"></span>
    </header>
    <div>
      <div class="segmented">
        <button type="button" class="active" id="seg-paste">テキスト貼り付け</button>
        <button type="button" id="seg-url">URLから取得</button>
      </div>

      <div id="pane-paste">
        <label class="field-label">タイトル(空欄可)</label>
        <input type="text" id="paste-title" placeholder="記事のタイトル">
        <label class="field-label">本文</label>
        <textarea id="paste-body" placeholder="ここに記事本文を貼り付けてください"></textarea>
        <button class="primary-btn" id="btn-save-paste">この記事を追加</button>
      </div>

      <div id="pane-url" class="hidden">
        <label class="field-label">記事のURL</label>
        <input type="url" id="url-input" placeholder="https://example.com/article">
        <button class="secondary-btn" id="btn-fetch-url">本文を取得する</button>
        <p class="hint">サイトによっては本文を自動取得できない場合があります。うまく取得できない場合は「テキスト貼り付け」に本文をコピペしてください。</p>
        <div id="url-status" class="status-msg"></div>
        <div id="url-result" class="hidden">
          <label class="field-label">タイトル</label>
          <input type="text" id="url-title">
          <label class="field-label">取得した本文(編集できます)</label>
          <textarea id="url-body"></textarea>
          <button class="primary-btn" id="btn-save-url">この記事を追加</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Settings View ===== -->
  <section id="view-settings" class="view">
    <header class="topbar">
      <button class="icon-btn" id="btn-settings-back">‹</button>
      <h1>設定</h1>
      <span style="width:34px"></span>
    </header>
    <div>
      <div id="cloud-settings">
        <label class="field-label">読み上げ方式</label>
        <div class="segmented">
          <button type="button" id="engine-cloud">高音質</button>
          <button type="button" id="engine-device">端末の音声</button>
        </div>
        <p class="hint">
          高音質:画面をロックしても読み続けます。初回だけ音声の準備に少し時間がかかります(作った音声は端末に保存されます)。<br>
          端末の音声:すぐに読み上げますが、画面をロックすると止まります。
        </p>
        <label class="field-label">合言葉(高音質を使うときに必要)</label>
        <input type="password" id="passphrase-input" placeholder="家族で決めた合言葉" autocomplete="off">
        <button class="primary-btn" id="btn-settings-save">保存</button>
        <div id="settings-status" class="status-msg"></div>
        <label class="field-label">保存した音声</label>
        <button class="secondary-btn" id="btn-clear-audio">保存した音声を削除する</button>
      </div>
      <p id="cloud-unavailable" class="hint hidden">現在は端末の音声で読み上げます。</p>
    </div>
  </section>

  <!-- ===== Reader View ===== -->
  <section id="view-reader" class="view">
    <header class="topbar">
      <button class="icon-btn" id="btn-reader-back">‹</button>
      <h1 style="font-size:14px;">読み上げ</h1>
      <button class="icon-btn" id="btn-reader-delete">🗑</button>
    </header>
    <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="reader-header">
        <div class="reader-title" id="reader-title"></div>
        <div class="reader-source" id="reader-source"></div>
      </div>
      <div class="reader-text" id="reader-text"></div>
      <div class="controls-card">
        <div class="player-status" id="player-status"></div>
        <div class="progress-row">
          <span id="progress-current">0</span>
          <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
          <span id="progress-total">0</span>
        </div>
        <div class="transport">
          <button class="skip-btn" id="btn-prev" title="前の文へ">⏮</button>
          <button class="play-btn" id="btn-play">▶</button>
          <button class="skip-btn" id="btn-next" title="次の文へ">⏭</button>
        </div>
        <div class="rate-presets" id="rate-presets">
          <button type="button" data-rate="0.75">0.75x</button>
          <button type="button" data-rate="1">1.0x</button>
          <button type="button" data-rate="1.25">1.25x</button>
          <button type="button" data-rate="1.5">1.5x</button>
          <button type="button" data-rate="1.75">1.75x</button>
          <button type="button" data-rate="2">2.0x</button>
        </div>
        <div class="settings-row" style="margin-bottom:8px;">
          <span class="rate-label" id="rate-label">1.0x</span>
          <input type="range" id="rate-range" min="0.5" max="2" step="0.05" value="1">
        </div>
        <div class="settings-row">
          <select id="voice-select"></select>
        </div>
      </div>
    </div>
  </section>

</div>
<audio id="audio-player" preload="auto" playsinline></audio>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  var STORAGE_ARTICLES = "vr_articles_v1";
  var STORAGE_PROGRESS = "vr_progress_v1";
  var STORAGE_SETTINGS = "vr_settings_v1";

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  var articles = loadJSON(STORAGE_ARTICLES, []);   // [{id,title,source,text,addedAt}]
  var progress = loadJSON(STORAGE_PROGRESS, {});   // {articleId: {chunkIndex, total, updatedAt}}
  var settings = loadJSON(STORAGE_SETTINGS, {rate:1, voiceURI:null});

  function persistArticles(){ saveJSON(STORAGE_ARTICLES, articles); }
  function persistProgress(){ saveJSON(STORAGE_PROGRESS, progress); }
  function persistSettings(){ saveJSON(STORAGE_SETTINGS, settings); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  /* ---------- text chunking ---------- */
  function splitIntoChunks(text){
    var normalized = text.replace(/\r\n/g,"\n").trim();
    // split on sentence-ending punctuation (Japanese/English) while keeping the punctuation
    var raw = normalized.split(/(?<=[。！？!?])\s*|\n+/);
    var chunks = [];
    raw.forEach(function(s){
      var t = s.trim();
      if(!t) return;
      // merge very short fragments into previous chunk to avoid choppy speech
      if(chunks.length && t.length < 6 && !/[。！？!?]$/.test(chunks[chunks.length-1])){
        chunks[chunks.length-1] += t;
      } else {
        chunks.push(t);
      }
    });
    if(!chunks.length) chunks = [normalized];
    // cap very long sentences so highlighting stays useful and each piece fits a TTS request
    return [].concat.apply([], chunks.map(splitLongChunk));
  }

  var MAX_CHUNK_CHARS = 200;
  function splitLongChunk(s){
    var out = [];
    while(s.length > MAX_CHUNK_CHARS){
      var cut = Math.max(
        s.lastIndexOf("、", MAX_CHUNK_CHARS), s.lastIndexOf("，", MAX_CHUNK_CHARS),
        s.lastIndexOf(",", MAX_CHUNK_CHARS), s.lastIndexOf(" ", MAX_CHUNK_CHARS)
      );
      if(cut < MAX_CHUNK_CHARS / 2) cut = MAX_CHUNK_CHARS - 1;
      out.push(s.slice(0, cut + 1).trim());
      s = s.slice(cut + 1).trim();
    }
    if(s) out.push(s);
    return out;
  }

  function isJapanese(text){
    return /[぀-ヿ㐀-鿿]/.test(text);
  }

  /* ---------- view management ---------- */
  var views = {
    list: document.getElementById("view-list"),
    add: document.getElementById("view-add"),
    settings: document.getElementById("view-settings"),
    reader: document.getElementById("view-reader")
  };
  function showView(name){
    Object.keys(views).forEach(function(k){ views[k].classList.toggle("active", k===name); });
    if(name === "list") renderList();
  }

  /* ---------- list view ---------- */
  var articleListEl = document.getElementById("article-list");
  var emptyStateEl = document.getElementById("empty-state");

  function renderList(){
    articleListEl.innerHTML = "";
    if(!articles.length){
      emptyStateEl.classList.remove("hidden");
      return;
    }
    emptyStateEl.classList.add("hidden");
    articles.slice().reverse().forEach(function(article){
      var li = document.createElement("li");
      li.className = "article-card";
      var p = progress[article.id];
      var pct = 0;
      var label = "未再生";
      if(p && p.total){
        pct = Math.min(100, Math.round((p.chunkIndex / p.total) * 100));
        label = pct >= 100 ? "読了" : "続きから (" + pct + "%)";
      }
      li.innerHTML =
        '<div class="article-title"></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="article-meta"><span class="meta-label"></span><span></span></div>';
      li.querySelector(".article-title").textContent = article.title || "(無題の記事)";
      li.querySelector(".meta-label").textContent = label;
      li.addEventListener("click", function(){ openReader(article.id); });
      articleListEl.appendChild(li);
    });
  }

  document.getElementById("btn-add-open").addEventListener("click", function(){
    resetAddView();
    showView("add");
  });
  document.getElementById("btn-add-cancel").addEventListener("click", function(){ showView("list"); });

  /* ---------- add view ---------- */
  var segPaste = document.getElementById("seg-paste");
  var segUrl = document.getElementById("seg-url");
  var panePaste = document.getElementById("pane-paste");
  var paneUrl = document.getElementById("pane-url");

  segPaste.addEventListener("click", function(){
    segPaste.classList.add("active"); segUrl.classList.remove("active");
    panePaste.classList.remove("hidden"); paneUrl.classList.add("hidden");
  });
  segUrl.addEventListener("click", function(){
    segUrl.classList.add("active"); segPaste.classList.remove("active");
    paneUrl.classList.remove("hidden"); panePaste.classList.add("hidden");
  });

  function resetAddView(){
    segPaste.click();
    document.getElementById("paste-title").value = "";
    document.getElementById("paste-body").value = "";
    document.getElementById("url-input").value = "";
    document.getElementById("url-status").textContent = "";
    document.getElementById("url-status").className = "status-msg";
    document.getElementById("url-result").classList.add("hidden");
  }

  function addArticle(title, text, source){
    text = text.trim();
    if(!text) return;
    var firstLine = text.split(/\n/)[0].slice(0,40);
    var article = {
      id: uid(),
      title: (title || "").trim() || firstLine || "(無題の記事)",
      source: source || "",
      text: text,
      addedAt: Date.now()
    };
    articles.push(article);
    persistArticles();
    showView("list");
    openReader(article.id);
  }

  document.getElementById("btn-save-paste").addEventListener("click", function(){
    var title = document.getElementById("paste-title").value;
    var body = document.getElementById("paste-body").value;
    if(!body.trim()){ document.getElementById("paste-body").focus(); return; }
    addArticle(title, body, "");
  });

  /* ---- URL fetch (best effort via public CORS proxy + simple readability) ---- */
  document.getElementById("btn-fetch-url").addEventListener("click", function(){
    var url = document.getElementById("url-input").value.trim();
    var statusEl = document.getElementById("url-status");
    var resultEl = document.getElementById("url-result");
    resultEl.classList.add("hidden");
    if(!url){ return; }
    try{ new URL(url); }catch(e){
      statusEl.className = "status-msg error";
      statusEl.textContent = "正しいURLを入力してください。";
      return;
    }
    statusEl.className = "status-msg";
    statusEl.textContent = "取得中…";

    var proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 12000);
    fetch(proxied, {signal: controller.signal}).then(function(res){
      clearTimeout(timeoutId);
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(function(html){
      var extracted = extractArticle(html);
      if(!extracted.text){
        throw new Error("本文を検出できませんでした");
      }
      statusEl.className = "status-msg ok";
      statusEl.textContent = "本文を取得しました。内容を確認して追加してください。";
      document.getElementById("url-title").value = extracted.title;
      document.getElementById("url-body").value = extracted.text;
      resultEl.classList.remove("hidden");
    }).catch(function(err){
      clearTimeout(timeoutId);
      statusEl.className = "status-msg error";
      var reason = err.name === "AbortError" ? "タイムアウトしました" : err.message;
      statusEl.textContent = "取得に失敗しました(" + reason + ")。「テキスト貼り付け」から本文をコピペしてください。";
    });

    function extractArticle(html){
      var doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script,style,nav,header,footer,aside,noscript,iframe,form").forEach(function(el){ el.remove(); });
      var title = (doc.querySelector("h1") && doc.querySelector("h1").textContent.trim())
        || (doc.querySelector("title") && doc.querySelector("title").textContent.trim())
        || "";
      var container = doc.querySelector("article") || doc.body;
      var candidates = container.querySelectorAll("p");
      var text = Array.prototype.map.call(candidates, function(p){ return p.textContent.trim(); })
        .filter(function(t){ return t.length > 15; })
        .join("\n");
      if(!text && container){ text = container.textContent.trim().slice(0, 4000); }
      return { title: title, text: text };
    }

    // set the article's source url for later reference
    document.getElementById("btn-save-url").onclick = function(){
      var t = document.getElementById("url-title").value;
      var b = document.getElementById("url-body").value;
      if(!b.trim()) return;
      addArticle(t, b, url);
    };
  });

  /* ---------- reader view / playback ---------- */
  var currentArticle = null;
  var currentChunks = [];
  var currentIndex = 0;
  var playState = "stopped";   // stopped | loading | playing | paused
  var activeEngine = null;     // "cloud" | "device" while a playback session is running

  var elReaderTitle = document.getElementById("reader-title");
  var elReaderSource = document.getElementById("reader-source");
  var elReaderText = document.getElementById("reader-text");
  var elProgressFill = document.getElementById("progress-fill");
  var elProgressCurrent = document.getElementById("progress-current");
  var elProgressTotal = document.getElementById("progress-total");
  var elPlayBtn = document.getElementById("btn-play");

  function openReader(articleId){

    currentArticle = article;
    currentChunks = splitIntoChunks(article.text);
    var p = progress[article.id];
    currentIndex = (p && p.chunkIndex < currentChunks.length) ? p.chunkIndex : 0;

    elReaderTitle.textContent = article.title;
    elReaderSource.textContent = article.source || "";
    elReaderSource.style.display = article.source ? "block" : "none";

    elReaderText.innerHTML = "";
    currentChunks.forEach(function(chunk, i){
      var span = document.createElement("span");
      span.className = "chunk";
      span.dataset.index = i;
      span.textContent = chunk + " ";

    showView("reader");
  }

  function highlightChunk(index, scroll){
    var nodes = elReaderText.querySelectorAll(".chunk");
    nodes.forEach(function(n){ n.classList.remove("speaking"); });
    var active = nodes[index];
    if(active){
      active.classList.add("speaking");
      if(scroll !== false) active.scrollIntoView({block:"center", behavior:"smooth"});
    }
  }

  function updateProgressUI(){
    var total = currentChunks.length;
    elProgressCurrent.textContent = Math.min(currentIndex, total);
    elProgressTotal.textContent = total;
    var pct = total ? Math.round((currentIndex/total)*100) : 0;
    elProgressFill.style.width = pct + "%";
  }

  function saveProgress(){
    if(!currentArticle) return;

      total: currentChunks.length,
      updatedAt: Date.now()

    persistProgress();
  }

  function setPlayState(state){

    elPlayBtn.disabled = state === "loading";
  }

  function setStatus(msg, isError){

  function finishPlayback(){

  }

  function stopPlayback(){

    setPlayState("stopped");

  function startPlayback(){

  function seekToChunk(i){
    if(!currentChunks.length) return;
    i = Math.max(0, Math.min(currentChunks.length - 1, i));
    if(activeEngine === "cloud" && cloud.ready && playState !== "loading"){

    } else if(activeEngine === "device" && playState !== "stopped"){

    saveProgress();

  /* ---- device voice (Web Speech API): stops when the screen locks ---- */
  var synth = window.speechSynthesis;
  var speechToken = 0;

  function pickVoice(){
    var voices = synth.getVoices();
    if(settings.voiceURI){
      var found = voices.find(function(v){ return v.voiceURI === settings.voiceURI; });
      if(found) return found;
    }
    if(currentArticle && isJapanese(currentArticle.text)){
      var ja = voices.find(function(v){ return /ja/i.test(v.lang); });
      if(ja) return ja;
    }
    return voices[0] || null;
  }

  // keep the screen from auto-locking while reading (iOS stops speech when locked)

  function requestWakeLock(){

    wakeLock.release().catch(function(){});
    wakeLock = null;
  }

  function deviceSpeakFrom(index){

    var token = ++speechToken;
    synth.cancel();
    if(synth.paused) synth.resume();
    if(index >= currentChunks.length){ finishPlayback(); return; }
    activeEngine = "device";
    currentIndex = index;
    var utter = new SpeechSynthesisUtterance(currentChunks[index]);
    var voice = pickVoice();
    if(voice) utter.voice = voice;
    utter.rate = settings.rate || 1;
    utter.lang = voice ? voice.lang : (isJapanese(currentChunks[index]) ? "ja-JP" : "en-US");

    utter.onstart = function(){
      if(token !== speechToken) return;
      highlightChunk(index);
      updateProgressUI();
    };
    utter.onend = function(){
      if(token !== speechToken) return;
      saveProgress();
      deviceSpeakFrom(index + 1);
    };
    utter.onerror = function(){
      if(token !== speechToken) return;
      activeEngine = null;
      releaseWakeLock();

  /* ---- high quality voice: audio made by Google Cloud TTS via a relay, keeps playing while locked ---- */
  // URL of the Cloudflare Worker that relays to Google Cloud Text-to-Speech (see cloudflare-worker.js)
  var DEFAULT_TTS_ENDPOINT = "https://nameless-rice-bb65.a0448yoshiya.workers.dev";

    {name:"ja-JP-Neural2-C", label:"男性1"},
    {name:"ja-JP-Neural2-D", label:"男性2"},
    {name:"ja-JP-Wavenet-A", label:"女性2"},
    {name:"ja-JP-Wavenet-B", label:"女性3"},
    {name:"ja-JP-Wavenet-C", label:"男性3"},

    return CLOUD_VOICES.some(function(c){ return c.name === v; }) ? v : CLOUD_VOICES[0].name;

  var cloud = { ready:false, articleId:null, voice:null, url:null, chunkStarts:[] };

  var lastProgressSave = 0;

  function cloudPlay(){
    var article = currentArticle;
    var voice = cloudVoiceName();
    activeEngine = "cloud";
    if(cloud.ready && cloud.articleId === article.id && cloud.voice === voice){
      audioEl.currentTime = (cloud.chunkStarts[currentIndex] || 0) + 0.05;
      applyRate();
      setupMediaSession(article);
      startAudio();
      return;
    }

    cloud.ready = false;

    audioEl.src = silentWavUrl();

    setStatus("音声を準備中…");

    }).then(function(rec){
      if(session !== cloudSession) return;
      loadCloudRecord(article, voice, rec);
      return waitForMetadata().then(function(){
        if(session !== cloudSession) return;
        audioEl.currentTime = (cloud.chunkStarts[currentIndex] || 0) + 0.05;
        applyRate();
        setupMediaSession(article);
        setStatus("");
        startAudio();

    }).catch(function(err){
      if(session !== cloudSession) return;
      activeEngine = null;
      cloud.ready = false;
      audioEl.pause();
      audioEl.removeAttribute("src");
      setPlayState("stopped");
      setStatus(describeCloudError(err), true);
    });
  }

  function startAudio(){
    setPlayState("playing");
    var p = audioEl.play();
    if(p && p.catch) p.catch(function(){

      setStatus("準備ができました。▶をタップして再生してください。");

  function loadCloudRecord(article, voice, rec){
    if(cloud.url) URL.revokeObjectURL(cloud.url);
    cloud.url = URL.createObjectURL(rec.blob);
    cloud.articleId = article.id;
    cloud.voice = voice;
    cloud.chunkStarts = computeChunkStarts(rec.segments);
    cloud.ready = true;
    audioEl.src = cloud.url;
  }

  function forgetCloudAudio(){
    cloud.ready = false;
    cloud.articleId = null;
    if(cloud.url){ URL.revokeObjectURL(cloud.url); cloud.url = null; }
  }

  function waitForMetadata(){
    return new Promise(function(resolve, reject){
      if(audioEl.readyState >= 1) return resolve();
      function ok(){ cleanup(); resolve(); }
      function ng(){ cleanup(); reject(new Error("音声を読み込めませんでした")); }

        audioEl.removeEventListener("loadedmetadata", ok);
        audioEl.removeEventListener("error", ng);
      }
      audioEl.addEventListener("loadedmetadata", ok);
      audioEl.addEventListener("error", ng);
    });

  // estimate when each sentence starts: exact per request, proportional to length inside one
  function computeChunkStarts(segments){
    var starts = [];
    var t = 0;
    segments.forEach(function(seg){
      var weights = [], sum = 0;
      for(var i = seg.first; i <= seg.last; i++){
        var w = currentChunks[i].length + 4;   // +4 approximates the pause after each sentence
        weights.push(w);
        sum += w;
      }
      var acc = 0;
      for(var j = 0; j < weights.length; j++){
        starts[seg.first + j] = t + seg.duration * acc / sum;
        acc += weights[j];
      }
      t += seg.duration;
    });
    return starts;
  }

  function chunkAtTime(t){
    var starts = cloud.chunkStarts, lo = 0, hi = starts.length - 1;
    while(lo < hi){
      var mid = (lo + hi + 1) >> 1;
      if(starts[mid] <= t) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  audioEl.addEventListener("timeupdate", function(){
    if(activeEngine !== "cloud" || !cloud.ready) return;
    var idx = chunkAtTime(audioEl.currentTime);
    if(idx !== currentIndex){
      currentIndex = idx;
      highlightChunk(idx);
      updateProgressUI();
    }
    var now = Date.now();
    if(now - lastProgressSave > 5000){
      lastProgressSave = now;
      saveProgress();
    }

  // keep the button in sync when playback is controlled from the lock screen
  audioEl.addEventListener("pause", function(){
    if(activeEngine !== "cloud" || !cloud.ready || audioEl.ended) return;
    setPlayState("paused");
    saveProgress();
  });
  audioEl.addEventListener("play", function(){
    if(activeEngine !== "cloud" || !cloud.ready) return;
    setPlayState("playing");
  });

  function applyRate(){
    var r = settings.rate || 1;
    audioEl.defaultPlaybackRate = r;
    audioEl.playbackRate = r;
  }

  function setupMediaSession(article){
    if(!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    try{ navigator.mediaSession.metadata = new MediaMetadata({ title: article.title, artist: "読み上げリーダー" }); }catch(e){}
  }
  if("mediaSession" in navigator){
    var setMediaHandler = function(name, fn){ try{ navigator.mediaSession.setActionHandler(name, fn); }catch(e){} };
    setMediaHandler("play", function(){ if(activeEngine === "cloud" && cloud.ready) startAudio(); });
    setMediaHandler("pause", function(){ if(activeEngine === "cloud") audioEl.pause(); });
    setMediaHandler("seekbackward", function(d){
      if(cloud.ready) audioEl.currentTime = Math.max(0, audioEl.currentTime - ((d && d.seekOffset) || 10));
    });
    setMediaHandler("seekforward", function(d){

  // 0.1s of silence, used to unlock the audio element during the tap
  var silentUrl = null;
  function silentWavUrl(){
    if(silentUrl) return silentUrl;
    var n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    function str(o, s){ for(var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, "data"); v.setUint32(40, n, true);
    for(var i = 0; i < n; i++) v.setUint8(44 + i, 128);
    silentUrl = URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));

  }

  function hashString(s){
    var h = 5381;
    for(var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  function prepareCloudAudio(article, voice, onProgress){
    var key = voice + ":" + currentChunks.length + ":" + hashString(article.text);
    return idbGet(article.id).then(function(rec){
      if(rec && rec.key === key) return rec;
      if(!settings.passphrase){
        var e = new Error("no passphrase");
        e.code = "NO_PASSPHRASE";
        throw e;
      }
      return synthesizeChunks(voice, onProgress).then(function(result){
        var fresh = { id: article.id, key: key, blob: result.blob, segments: result.segments };
        return idbPut(fresh).catch(function(){}).then(function(){ return fresh; });
      });
    });
  }

  var textEncoder = new TextEncoder();
  function buildSegments(chunks){
    var groups = [], cur = null;
    chunks.forEach(function(c, i){
      var bytes = textEncoder.encode(c).length + 1;
      if(cur && cur.bytes + bytes <= MAX_SEGMENT_BYTES){
        cur.text += "\n" + c;
        cur.last = i;
        cur.bytes += bytes;
      } else {
        cur = { first: i, last: i, text: c, bytes: bytes };
        groups.push(cur);
      }
    });
    return groups;
  }

  function synthesizeChunks(voice, onProgress){
    var groups = buildSegments(currentChunks);
    var results = new Array(groups.length);
    var next = 0, done = 0, failed = false;
    onProgress(0, groups.length);
    function work(){
      if(failed || next >= groups.length) return Promise.resolve();
      var i = next++;
      return requestSpeech(groups[i].text, voice).then(function(mp3){
        results[i] = mp3;
        onProgress(++done, groups.length);
        return work();
      }, function(err){ failed = true; throw err; });
    }
    var workers = [];
    for(var k = 0; k < Math.min(PARALLEL_REQUESTS, groups.length); k++) workers.push(work());
    return Promise.all(workers).then(function(){
      return {
        blob: new Blob(results.map(function(r){ return r.bytes; }), {type:"audio/mpeg"}),
        segments: results.map(function(r, i){ return { first: groups[i].first, last: groups[i].last, duration: r.duration }; })
      };
    });
  }

  function requestSpeech(text, voice){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 30000);
    return fetch(TTS_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Passphrase": settings.passphrase || "" },
      body: JSON.stringify({ text: text, voice: voice }),
      signal: controller.signal
    }).then(function(res){
      if(!res.ok){
        var e = new Error("HTTP " + res.status);
        e.status = res.status;
        throw e;
      }
      return res.json();
    }).then(function(data){
      clearTimeout(timer);
      if(!data || !data.audioContent) throw new Error("音声データが空でした");
      return parseMp3(base64ToBytes(data.audioContent));
    }).catch(function(err){
      clearTimeout(timer);
      throw err;
    });
  }

  function describeCloudError(err){
    var hint = "(設定⚙で「端末の音声」に切り替えると、すぐに読み上げできます)";
    if(err.code === "NO_PASSPHRASE") return "設定⚙で合言葉を入力してください。";
    if(err.status === 401) return "合言葉が違います。設定⚙で確認してください。";
    if(err.status === 429) return "混み合っています。少し待ってからもう一度お試しください。";
    if(err.name === "AbortError") return "時間がかかりすぎたため中断しました。" + hint;
    if(err instanceof TypeError) return "音声サーバーに接続できませんでした。" + hint;
    return "音声を作れませんでした(" + (err.status ? "HTTP " + err.status : err.message) + ")。" + hint;
  }

  function base64ToBytes(b64){
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Parse an MP3 (Layer III) stream: drop ID3 / Xing headers so pieces can be joined into
  // one continuous file, and count frames to get the exact duration.
  var MP3_BITRATES = {
    v1: [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320],
    v2: [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160]
  };
  var MP3_SAMPLE_RATES = { 3:[44100,48000,32000], 2:[22050,24000,16000], 0:[11025,12000,8000] };

  function mp3FrameAt(b, i){
    if(i + 4 > b.length || b[i] !== 0xFF || (b[i+1] & 0xE0) !== 0xE0) return null;
    var version = (b[i+1] >> 3) & 3, layer = (b[i+1] >> 1) & 3;
    var brIndex = (b[i+2] >> 4) & 15, srIndex = (b[i+2] >> 2) & 3, padding = (b[i+2] >> 1) & 1;
    if(version === 1 || layer !== 1 || brIndex === 0 || brIndex === 15 || srIndex === 3) return null;
    var bitrate = (version === 3 ? MP3_BITRATES.v1 : MP3_BITRATES.v2)[brIndex] * 1000;
    var sampleRate = MP3_SAMPLE_RATES[version][srIndex];
    return {
      length: Math.floor((version === 3 ? 144 : 72) * bitrate / sampleRate) + padding,
      samples: version === 3 ? 1152 : 576,
      sampleRate: sampleRate
    };
  }

  function parseMp3(b){
    var i = 0;
    if(b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33){   // "ID3"
      i = 10 + (((b[6] & 0x7f) << 21) | ((b[7] & 0x7f) << 14) | ((b[8] & 0x7f) << 7) | (b[9] & 0x7f));
      if(b[5] & 0x10) i += 10;
    }
    var start = -1, end = -1, seconds = 0, first = true;
    while(i < b.length){
      var f = mp3FrameAt(b, i);
      if(!f){ i++; continue; }
      if(i + f.length > b.length) break;
      if(first){
        first = false;
        var tag = String.fromCharCode.apply(null, b.subarray(i + 4, Math.min(i + 48, b.length)));
        if(/Xing|Info|VBRI/.test(tag)){ i += f.length; continue; }
      }
      if(start < 0) start = i;
      seconds += f.samples / f.sampleRate;
      i += f.length;
      end = i;
    }
    if(start < 0) throw new Error("音声データの形式が正しくありません");
    return { bytes: b.subarray(start, end), duration: seconds };
  }

  /* ---- saved audio (IndexedDB) ---- */
  var dbPromise = null;
  function openDb(){
    if(!dbPromise){
      dbPromise = new Promise(function(resolve, reject){
        if(!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
        var req = indexedDB.open("voice-reader", 1);
        req.onupgradeneeded = function(){ req.result.createObjectStore("audio", { keyPath: "id" }); };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
      dbPromise.catch(function(){ dbPromise = null; });
    }
    return dbPromise;
  }
  function idbRequest(mode, fn){
    return openDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction("audio", mode);
        var req = fn(tx.objectStore("audio"));
        tx.oncomplete = function(){ resolve(req.result); };
        tx.onerror = tx.onabort = function(){ reject(tx.error); };
      });
    });
  }
  function idbGet(id){ return idbRequest("readonly", function(s){ return s.get(id); }).catch(function(){ return null; }); }
  function idbPut(rec){ return idbRequest("readwrite", function(s){ return s.put(rec); }); }
  function idbDelete(id){ return idbRequest("readwrite", function(s){ return s.delete(id); }).catch(function(){}); }
  function idbClear(){ return idbRequest("readwrite", function(s){ return s.clear(); }); }

  }

  /* ---- controls ---- */

  /* ---- voice / rate settings ---- */
  function populateVoices(){

    }
    if(!synth) return;
    synth.getVoices().forEach(function(v){
      var opt = document.createElement("option");
      opt.value = v.voiceURI;
      opt.textContent = v.name + " (" + v.lang + ")";
      voiceSelect.appendChild(opt);
    });
    if(settings.voiceURI) voiceSelect.value = settings.voiceURI;
  }
  populateVoices();
  if(synth) synth.addEventListener("voiceschanged", populateVoices);

  voiceSelect.addEventListener("change", function(){
    if(useCloud()){
      settings.cloudVoice = voiceSelect.value;
      persistSettings();
      if(activeEngine === "cloud"){
        saveProgress();
        stopPlayback();
        setStatus("声を変更しました。▶で新しい声の音声を作って再生します。");
      }
      return;
    }
    settings.voiceURI = voiceSelect.value;
    persistSettings();
    if(activeEngine === "device" && playState === "playing") deviceSpeakFrom(currentIndex);
  });

  var ratePresets = document.getElementById("rate-presets");

  function formatRate(r){
    var s = r.toFixed(2);
    if(s.charAt(s.length-1) === "0") s = s.slice(0,-1);
    return s + "x";
  }

  function updateRateUI(){
    var r = settings.rate || 1;
    rateRange.value = r;
    rateLabel.textContent = formatRate(r);
    ratePresets.querySelectorAll("button").forEach(function(btn){
      btn.classList.toggle("active", Math.abs(parseFloat(btn.dataset.rate) - r) < 0.001);
    });
  }

  function setRate(newRate, restart){
    settings.rate = newRate;
    persistSettings();
    updateRateUI();
    applyRate();   // audio changes speed in place; device speech has to restart the sentence
    if(restart && activeEngine === "device" && playState === "playing") deviceSpeakFrom(currentIndex);
  }

  ratePresets.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-rate]");
    if(!btn) return;
    setRate(parseFloat(btn.dataset.rate), true);
  });

  updateRateUI();
  rateRange.addEventListener("input", function(){
    setRate(parseFloat(rateRange.value), false);
  });
  rateRange.addEventListener("change", function(){
    if(activeEngine === "device" && playState === "playing") deviceSpeakFrom(currentIndex);
  });

  /* ---------- settings view ---------- */
  var engineCloudBtn = document.getElementById("engine-cloud");
  var engineDeviceBtn = document.getElementById("engine-device");
  var passphraseInput = document.getElementById("passphrase-input");
  var settingsStatus = document.getElementById("settings-status");

  function showSettingsStatus(msg, ok){
    settingsStatus.textContent = msg;
    settingsStatus.className = "status-msg " + (ok ? "ok" : "error");
  }

  function renderSettings(){
    document.getElementById("cloud-settings").classList.toggle("hidden", !cloudAvailable());
    document.getElementById("cloud-unavailable").classList.toggle("hidden", cloudAvailable());
    engineCloudBtn.classList.toggle("active", settings.engine !== "device");
    engineDeviceBtn.classList.toggle("active", settings.engine === "device");
    passphraseInput.value = settings.passphrase || "";
    settingsStatus.textContent = "";
  }

  function setEngine(engine){
    settings.engine = engine;
    persistSettings();
    renderSettings();
    populateVoices();
  }
  engineCloudBtn.addEventListener("click", function(){ setEngine("cloud"); });
  engineDeviceBtn.addEventListener("click", function(){ setEngine("device"); });

  passphraseInput.addEventListener("input", function(){
    settings.passphrase = passphraseInput.value.trim();
    persistSettings();
  });
  document.getElementById("btn-settings-save").addEventListener("click", function(){
    settings.passphrase = passphraseInput.value.trim();
    persistSettings();
    showSettingsStatus("保存しました。", true);
  });

  document.getElementById("btn-clear-audio").addEventListener("click", function(){
    if(!confirm("端末に保存した音声をすべて削除しますか?(次に再生するときに作り直します)")) return;
    forgetCloudAudio();
    idbClear().then(function(){
      showSettingsStatus("保存した音声を削除しました。", true);
    }, function(){
      showSettingsStatus("削除できませんでした。", false);
    });
  });

  document.getElementById("btn-settings-open").addEventListener("click", function(){
    renderSettings();
    showView("settings");
  });
  document.getElementById("btn-settings-back").addEventListener("click", function(){ showView("list"); });

  /* ---------- PWA service worker ---------- */
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  renderList();
})();
</script>
</body>
</html>
